# Rebuilds the SVG panels and README.md: when the generator or the profile
# data changes, and once a day so the contribution poster stays current.
name: build profile

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 6 * * *' # 03:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render panels
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- assets README.md src/data)" ]; then
            echo "already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md src/data
          git commit -m "chore: rebuild profile panels"
          git push

<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Edu Ferreira — Full Stack Developer</title>
  <desc id="desc">Banner escuro com detalhes em azul e dourado, apresentando Edu Ferreira e sua stack principal.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A12"/>
      <stop offset="0.58" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="76" y1="78" x2="570" y2="239" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(888 76) rotate(140) scale(420 260)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 330) rotate(-112) scale(310 260)">
      <stop stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#blueGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#goldGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="2"/>

  <g transform="translate(72 66)">
    <rect width="58" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="55" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="750" letter-spacing="-1.5">Edu Ferreira</text>
    <text x="2" y="90" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.2">FULL-STACK  •  PRODUCT  •  WEB</text>
    <text x="2" y="132" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Transformando regras complexas em experiências simples.</text>

    <g transform="translate(2 158)">
      <rect width="105" height="34" rx="17" fill="#0E7490" fill-opacity="0.22" stroke="#22D3EE" stroke-opacity="0.38"/>
      <text x="52.5" y="22" fill="#A5F3FC" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">React</text>
      <rect x="115" width="126" height="34" rx="17" fill="#1D4ED8" fill-opacity="0.2" stroke="#60A5FA" stroke-opacity="0.4"/>
      <text x="178" y="22" fill="#BFDBFE" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">TypeScript</text>
      <rect x="251" width="99" height="34" rx="17" fill="#B45309" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.38"/>
      <text x="300.5" y="22" fill="#FDE68A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">Java</text>
    </g>
  </g>

  <g transform="translate(743 47)" filter="url(#shadow)">
    <rect width="387" height="226" rx="18" fill="#0B1220" fill-opacity="0.92" stroke="#64748B" stroke-opacity="0.28"/>
    <rect width="387" height="39" rx="18" fill="#151E2E"/>
    <rect y="22" width="387" height="17" fill="#151E2E"/>
    <circle cx="22" cy="20" r="5" fill="#FB7185"/>
    <circle cx="39" cy="20" r="5" fill="#FBBF24"/>
    <circle cx="56" cy="20" r="5" fill="#34D399"/>
    <text x="193.5" y="24" fill="#64748B" text-anchor="middle" font-family="Consolas, monospace" font-size="11">build-product.ts</text>

    <g font-family="Consolas, monospace" font-size="14">
      <text x="26" y="72" fill="#C084FC">const</text>
      <text x="74" y="72" fill="#E2E8F0">developer</text>
      <text x="155" y="72" fill="#94A3B8">=</text>
      <text x="173" y="72" fill="#94A3B8">{</text>

      <text x="44" y="101" fill="#7DD3FC">focus:</text>
      <text x="104" y="101" fill="#86EFAC">&quot;produto real&quot;</text>
      <text x="229" y="101" fill="#94A3B8">,</text>

      <text x="44" y="130" fill="#7DD3FC">craft:</text>
      <text x="104" y="130" fill="#86EFAC">&quot;UX + código&quot;</text>
      <text x="239" y="130" fill="#94A3B8">,</text>

      <text x="44" y="159" fill="#7DD3FC">mindset:</text>
      <text x="120" y="159" fill="#86EFAC">&quot;ship, learn, improve&quot;</text>

      <text x="26" y="188" fill="#94A3B8">};</text>
      <text x="26" y="211" fill="#64748B">// ideias que chegam ao usuário</text>
    </g>
  </g>
</svg>

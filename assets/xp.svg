<text x="24" y="239.6" style="animation:pop .32s 2.557s backwards">code got cheap. reading it never did.</text>
<text x="24" y="265.6" style="animation:pop .32s 2.907s backwards">the crowd hands its thinking to a prompt and ships whatever comes back.</text>
<text x="24" y="291.6" style="animation:pop .32s 3.257s backwards">i stay in the editor, line by line, learning how things are meant to stand.</text>
<text x="24" y="317.6" style="animation:pop .32s 3.607s backwards">to me code was always a kind of art, and art was never meant to be outsourced.</text>
<text x="24" y="343.6" style="animation:pop .32s 3.957s backwards">every repo here is my taste in syntax. the judgment is mine too.</text>

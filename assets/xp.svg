<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 401" width="1000" height="401" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">xp.log</title>
<desc id="d">2025.02 → 2026.10: VTT · Vector Two Technologies, desenvolvedor web. code got cheap. reading it never did. the crowd hands its thinking to a prompt and ships whatever comes back. i stay in the editor, line by line, learning how things are meant to stand. to me code was always a kind of art, and art was never meant to be outsourced. every repo here is my taste in syntax. the judgment is mine too.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 918" width="1000" height="918" role="img" aria-labelledby="t d">
<title id="t">Experiência, por quê e contato</title>
<desc id="d">Vector Two Technologies (VTT), desenvolvedor web, 2025.02 a 2026.10: digital signage e retail media pro varejo. Entrei com html, css, javascript, java, mysql; saí com react, tomcat, arquitetura de sistema. code got cheap. reading it never did. the crowd hands its thinking to a prompt and ships whatever comes back. i stay in the editor, line by line, learning how things are meant to stand. to me code was always a kind of art, and art was never meant to be outsourced. every repo here is my taste in syntax. the judgment is mine too. curtiu algum projeto ou quer falar de vaga?</desc>
